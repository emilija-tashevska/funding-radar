# Google News searches. Widest reach of any source; polled gently.
google_news:
  locale: {hl: "en-GB", gl: "GB", ceid: "GB:en"}
  window: "when:3d"
  queries:
    - '"raises" ("seed" OR "series a" OR "series b") startup London'
    - '"raises" ("seed" OR "series a" OR "series b") startup UK'
    - '"secures" ("seed" OR "series a") funding London startup'
    - '"raises" ("seed" OR "series a" OR "series b") startup Europe'
    - '"raises" AI startup London funding'
    - '"raises" AI startup Europe funding'
    - '"led by" ("seed round" OR "Series A") London'
    - '"led by" ("seed round" OR "Series A") Berlin OR Paris OR Amsterdam OR Stockholm'
    - '"Series B" raises startup UK'
    - 'fintech OR healthtech OR "developer tools" raises "Series A" Europe'
    - '"raises" startup Paris OR Amsterdam OR Stockholm OR Madrid funding'
    - '"secures" funding startup Manchester OR Edinburgh OR Bristol OR Cambridge'
    - '"raises" million startup Britain OR Ireland OR Netherlands OR Germany OR France'
    - '"raises" million startup Spain OR Italy OR Sweden OR Denmark OR Portugal OR Poland'
    - '"venture debt" OR "growth round" OR "extension round" startup Europe raises'
    - 'European startup "funding round" led by investors'
    # The tracked funds' own sites do not announce portfolio rounds (checked from
    # the runner on 2026-09-27), so their companies are found through the press.
    - '"Antler" startup raises (seed OR "pre-seed")'
    - '"Entrepreneur First" startup raises (seed OR "pre-seed")'
    - '"Creandum" raises (seed OR "Series A")'
    - '"Techstars" startup raises seed'
  # Rounds reported only in the local language never reach the English feeds.
  extra_locales:
    - {hl: "de", gl: "DE", ceid: "DE:de", query: 'startup "Millionen" Finanzierungsrunde'}
    - {hl: "fr", gl: "FR", ceid: "FR:fr", query: 'startup "levée de fonds" millions'}
    - {hl: "nl", gl: "NL", ceid: "NL:nl", query: 'startup investering miljoen ophaalt'}
    - {hl: "sv", gl: "SE", ceid: "SE:sv", query: 'startup finansieringsrunda miljoner'}
    - {hl: "es", gl: "ES", ceid: "ES:es", query: 'startup "ronda de financiación" millones'}

# GDELT adds non-English European coverage.
gdelt:
  # One request per 5 seconds, and it throttles an IP for a while after a burst.
  # The client paces itself, but expect the odd failed run; it is a bonus source,
  # never the backbone. Source health will show when it is unavailable.
  enabled: true
  timespan: "2d"
  queries:
    - '("raises" OR "funding round" OR "secures funding") (seed OR "series a" OR "series b")'

# Fund announcement pages: often the first public word, and they name the investor.
vc_pages:
  # Only funds whose pages carry "our investment in X" posts, with verified URLs.
  # Yield is low next to Google News; kept because they are often first and name the investor.
  - {name: Index Ventures, url: "https://www.indexventures.com/perspectives/"}
  - {name: Accel, url: "https://www.accel.com/news"}
  - {name: Atomico, url: "https://atomico.com/insights"}
  - {name: Creandum, url: "https://creandum.com/stories/"}
  - {name: Northzone, url: "https://northzone.com/insights"}
  - {name: Cherry Ventures, url: "https://www.cherry.vc/news"}
  - {name: Speedinvest, url: "https://www.speedinvest.com/knowledge"}
  - {name: EQT Ventures, url: "https://eqtgroup.com/news"}
  - {name: LocalGlobe, url: "https://www.phoenixcourt.vc/news"}
  - {name: Seedcamp, url: "https://seedcamp.com/views/?filter_type=news"}
  - {name: Antler, url: "https://www.antler.co/insights"}
  - {name: Entrepreneur First, url: "https://www.joinef.com/insights/"}
  - {name: Octopus Ventures, url: "https://octopusventures.com/blog/"}

# UK Companies House: verification and unannounced raises (needs COMPANIES_HOUSE_KEY).
companies_house:
  enabled: false

# Search APIs as a discovery source. Off in the scan until scripts/search_probe.py
# has measured which provider finds new in-brief UK rounds for the money. Six
# searches a run (the owner's budget), one search per query.
web_search:
  enabled: false
  country: GB
  days: 3
  queries:
    - UK startup raises seed round
    - London startup raises Series A funding
    - UK startup pre-seed funding announced
    - British startup secures Series B investment
    - startup raises funding Manchester OR Edinburgh OR Bristol OR Cambridge OR Leeds
    - Finsmes UK company funding round
  # The same four funds through web search, to compare with the free Google News
  # queries above before paying for them in the scan.
  fund_queries:
    - Antler backed startup raises seed or pre-seed round
    - Entrepreneur First founded startup raises seed round
    - Creandum leads seed round
    - Techstars alumni startup raises seed round
