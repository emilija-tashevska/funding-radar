  - {name: Balderton, url: "https://www.balderton.com/news/"}
  - {name: LocalGlobe, url: "https://localglobe.vc/news/"}
  - {name: Seedcamp, url: "https://seedcamp.com/resources/"}
  - {name: Accel, url: "https://www.accel.com/noteworthy"}
  - {name: Notion Capital, url: "https://notion.vc/news/"}
  - {name: Dawn Capital, url: "https://dawncapital.com/news/"}
  - {name: Air Street Capital, url: "https://www.airstreet.com/blog"}
  - {name: Atomico, url: "https://atomico.com/insights/"}
  - {name: Creandum, url: "https://creandum.com/stories/"}
  - {name: Northzone, url: "https://northzone.com/news/"}
  - {name: EQT Ventures, url: "https://eqtgroup.com/news"}
  - {name: Point Nine, url: "https://www.pointnine.com/blog"}
  - {name: Cherry Ventures, url: "https://www.cherry.vc/news"}
