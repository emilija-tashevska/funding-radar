# Funding Radar sources. Every source reports its own health; a source that falls to
# near-zero is flagged rather than silently reducing coverage.

filters:
  # No size floor: every round raised in brief is included, whatever its size.
  # (Was 2M with lower floors for Antler and EF; the owner removed it on 2026-09-27.)
  # The floor mechanism still works if a value above 0 is set here again.
  min_amount: 0
  min_amount_currencies: [USD, GBP, EUR]
  # Funds whose portfolio we follow; stored as tracked in the investors table.
  tracked_investors: [Antler, Entrepreneur First, Creandum, Techstars]
  stages: [pre-seed, seed, series a, series b]
  regions: [uk, europe]
  # Rounds stay on the site for this long.
  window_days: 120
  # Cheap keyword gate before any model call.
  keywords:
    - raises
    - raised
    - funding
    - fundraise
    - seed round
    - pre-seed
    - series a
    - series b
    - venture round
    - investment round
    - secures
    - closes
    - led by
    - backed by
    - million
    - "$"
    - "€"
    - "£"

# Claude assigns each company exactly one of these, so filters stay stable.
# Anything it cannot place goes to "other" for periodic review.
sectors:
  - AI infrastructure and tooling
  - AI applications
  - Developer tools
  - Data and analytics
  - Cybersecurity
  - Fintech and payments
  - Insurtech
  - Regtech, legal and compliance
  - Enterprise SaaS and operations
  - HR and workforce
  - Healthtech
  - Biotech software
  - Climate and energy
  - Commerce and retail
  - Logistics and supply chain
  - Real estate and construction
  - Media and creative tools
  - Gaming
  - Education
  - Robotics and hardware
  - Space and geospatial
  - Consumer apps
  - Other

