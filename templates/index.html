<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funding Radar</title>
<!-- Tab icon: a radar sweep, inlined so the page stays one file. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2317594a%22/%3E%3Cpath d=%22M32 32 L32 8 A24 24 0 0 1 55 26 Z%22 fill=%22%237fe0b8%22 opacity=%22.55%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2223%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%225.5%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2211%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22 opacity=%22.7%22/%3E%3Ccircle cx=%2244%22 cy=%2219%22 r=%225.5%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fbfbfa; --panel: #fff; --ink: #16181c; --ink-2: #3f4550; --muted: #797f8a;
  --line: #e4e4e1; --line-2: #efefec; --accent: #17594a; --accent-ink: #fff;
  --accent-soft: #eef3f1; --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1012; --panel: #16181b; --ink: #f0f0ee; --ink-2: #c7c9cd; --muted: #8b9098;
    --line: #26282c; --line-2: #1e2023; --accent: #6bbfa4; --accent-ink: #0f1012;
    --accent-soft: #17211e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; }
h1 {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 30px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px;
}
header p { margin: 0; color: var(--muted); font-size: 13px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 14px 0 14px; border-bottom: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 10px; }
.label { width: 52px; flex: 0 0 auto; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.group { display: inline-flex; flex-wrap: wrap; gap: 8px; }
input[type=search], select {
  font: inherit; font-size: 14px; color: inherit; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; min-width: 0;
}
input[type=search] { flex: 1 1 240px; }
input[type=search]::placeholder { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip {
  font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink-2); border-radius: 999px; padding: 5px 12px;
  transition: background .12s, color .12s, border-color .12s;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; margin-left: 2px; }
.chip[aria-pressed="true"] .n { color: var(--accent-ink); opacity: .75; }
.none { font-size: 13px; color: var(--muted); }

.count { color: var(--muted); font-size: 13px; margin: 18px 0 6px; }
.card { border-bottom: 1px solid var(--line-2); padding: 20px 0; }
.card:last-child { border-bottom: 0; }
.head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.name a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
.name a:hover { border-color: var(--accent); }
.amount { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stage { color: var(--muted); font-size: 14px; }
.when { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.summary { margin: 7px 0 0; color: var(--ink-2); }
.summary .src { margin-left: 4px; font-size: 12px; color: var(--muted); text-decoration: none; }
.summary .src::before { content: "— "; }
.summary .src:hover { color: var(--accent); }
.meta { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
.meta b { color: var(--ink-2); font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.flag { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.read { margin-top: 10px; font-size: 13px; }
.read span { color: var(--muted); }
.read a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
.read a:hover { border-color: currentColor; }
.read a + a::before { content: " · "; color: var(--muted); border: 0; }
.read .more { color: var(--muted); margin-left: 8px; }
blockquote { margin: 10px 0 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 48px 0; text-align: center; }
footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
footer button { font: inherit; font-size: 12px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; text-decoration: underline; }
@media (max-width: 560px) {
  .wrap { padding: 28px 16px 60px; }
  .bar { position: static; }
  .label { width: auto; }
  .when { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Funding Radar</h1>
    <p id="subtitle"></p>
  </header>

  <div class="bar">
    <div class="row">
      <input type="search" id="q" placeholder="Search company, investor, sector…" autocomplete="off">
      <select id="sort" aria-label="Sort">
        <option value="date">Newest first</option>
        <option value="amount">Largest first</option>
      </select>
    </div>
    <div class="row"><span class="label">Where</span><span id="regions" class="group"></span></div>
    <div class="row"><span class="label">Stage</span><span id="stages" class="group"></span></div>
    <div class="row">
      <span class="label">Filter</span>
      <span class="group">
        <select id="minamt" aria-label="Minimum size">
          <option value="0">No minimum</option>
          <option value="1000000">1M+</option>
          <option value="2000000">2M+</option>
          <option value="5000000">5M+</option>
          <option value="10000000">10M+</option>
          <option value="25000000">25M+</option>
        </select>
        <select id="maxamt" aria-label="Maximum size">
          <option value="0">No upper limit</option>
          <option value="1000000">Up to 1M</option>
          <option value="2000000">Up to 2M</option>
          <option value="5000000">Up to 5M</option>
          <option value="10000000">Up to 10M</option>
          <option value="25000000">Up to 25M</option>
        </select>
        <button class="chip" id="f-followed" aria-pressed="false">Funds I follow</button>
        <button class="chip" id="f-ai" aria-pressed="false">AI-native</button>
        <button class="chip" id="f-studio" aria-pressed="false">Hide studios</button>
        <button class="chip ctrl" id="f-brief" aria-pressed="true" hidden>In brief only</button>
        <button class="chip ctrl" id="f-confirmed" aria-pressed="false" hidden>Confirmed only</button>
      </span>
    </div>
  </div>

  <p class="count" id="count"></p>
  <div id="list"></div>
  <footer>
    <span id="footnote"></span>
    <button id="mode"></button>
  </footer>
</div>

<script id="payload" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const ROUNDS = DATA.rounds;
const SYM = { USD: '$', GBP: '£', EUR: '€', CHF: 'CHF ', SEK: 'SEK ', NOK: 'NOK ', DKK: 'DKK ', PLN: 'PLN ', ILS: '₪' };
const REGION_LABEL = { uk: 'UK', europe: 'Europe', us: 'US', other: 'Elsewhere' };

// Two audiences: anyone reading the list, and whoever is checking the pipeline.
// Confirmation, disputes and the reasons a round sits outside the brief are working
// notes, so they are behind ?control=1 rather than on the page by default.
const params = new URLSearchParams(location.search);
let control = params.get('control') === '1';
try { control = control || localStorage.getItem('fr-control') === '1'; } catch (e) {}

const state = { q: '', sort: 'date', regions: new Set(), stages: new Set(),
                brief: true, confirmed: false, ai: false, hideStudios: false, minAmount: 0, maxAmount: 0,
                followed: false };

function money(r) {
  if (!r.amount) return 'undisclosed';
  const sym = SYM[r.currency] || (r.currency ? r.currency + ' ' : '');
  const n = r.amount >= 1e9 ? (r.amount / 1e9).toFixed(1).replace(/\.0$/, '') + 'B'
          : r.amount >= 1e6 ? (r.amount / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'
          : Math.round(r.amount / 1e3) + 'K';
  return sym + n;
}
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso), days = Math.floor((Date.now() - d) / 86400000);
  const label = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 14) return days + ' days ago';
  return label + (d.getFullYear() === new Date().getFullYear() ? '' : ' ' + d.getFullYear());
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// Links come from feeds and search results: only http(s) may become an href.
function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? u : ''; }

// Chips carry their count, and a chip that can only ever return nothing is not
// shown: all the in-brief rounds are European, so an empty "US" chip just reads
// as a filter that does not work.
function facetOf(r, key) { return key === 'regions' ? (r.region || 'other') : (r.stage || 'unstated'); }

function drawFacets(host, values, key, labels) {
  const counts = new Map(values.map(v => [v, 0]));
  ROUNDS.filter(r => matches(r, key)).forEach(r => {
    const value = facetOf(r, key);
    if (counts.has(value)) counts.set(value, counts.get(value) + 1);
  });
  host.innerHTML = '';
  values.forEach(value => {
    const selected = state[key].has(value);
    const n = counts.get(value) || 0;
    if (!n && !selected) return;
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.setAttribute('aria-pressed', String(selected));
    b.innerHTML = `${esc((labels && labels[value]) || value)} <span class="n">${n}</span>`;
    b.onclick = () => {
      if (selected) state[key].delete(value); else state[key].add(value);
      render();
    };
    host.appendChild(b);
  });
  if (!host.children.length) host.innerHTML = '<span class="none">nothing here yet</span>';
}

function matches(r, ignore) {
  // Outside the brief is a working distinction, so the list only ever shows
  // in-brief rounds unless the control view is on and the toggle is released.
  if (!control || state.brief) { if (!r.qualified) return false; }
  if (control && state.confirmed && !r.confirmed) return false;
  if (state.ai && !r.ai_native) return false;
  if (state.followed && !(r.followed || []).length) return false;
  if (state.hideStudios && r.is_studio) return false;
  if (state.minAmount && !(Number(r.amount_usd) >= state.minAmount)) return false;
  // An undisclosed amount is not "up to" anything, so a cap hides it too.
  if (state.maxAmount && !(Number(r.amount_usd) > 0 && Number(r.amount_usd) <= state.maxAmount)) return false;
  if (ignore !== 'regions' && state.regions.size && !state.regions.has(r.region || 'other')) return false;
  if (ignore !== 'stages' && state.stages.size && !state.stages.has(r.stage || 'unstated')) return false;
  if (state.q) {
    const hay = [r.company, r.summary, r.description, r.sector, r.hq, (r.investors || []).join(' '),
                 (r.sources || []).map(s => s.outlet).join(' ')].join(' ').toLowerCase();
    if (!state.q.split(/\s+/).every(term => hay.includes(term))) return false;
  }
  return true;
}

function host(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
}

// What the company does: the description written from the article when there is
// one, with the page it came from; the headline summary until then.
function about(r) {
  if (r.description) {
    const from = safeUrl(r.description_url)
      ? ` <a class="src" href="${esc(r.description_url)}" target="_blank" rel="noopener">${esc(host(r.description_url) || 'source')}</a>`
      : '';
    return `<p class="summary">${esc(r.description)}${from}</p>`;
  }
  return r.summary ? `<p class="summary">${esc(r.summary)}</p>` : '';
}

function card(r) {
  const tags = [];
  (r.followed || []).forEach(f => tags.push(`<span class="tag">${esc(f)}-backed</span>`));
  if (r.ai_native) tags.push('<span class="tag">AI-native</span>');
  if (r.is_studio) tags.push('<span class="tag">venture studio</span>');
  if (control) {
    tags.push(`<span class="tag">${r.confirmed ? 'confirmed' : 'unconfirmed'}</span>`);
    if (r.disputed) tags.push('<span class="tag flag">outlets disagree on the amount</span>');
    if (!r.qualified && r.qualified_reason) tags.push(`<span class="tag flag">${esc(r.qualified_reason)}</span>`);
  }
  const name = r.domain
    ? `<a href="https://${esc(r.domain)}" target="_blank" rel="noopener">${esc(r.company)}</a>`
    : esc(r.company);
  const facts = [r.sector, r.hq || REGION_LABEL[r.region] || r.region].filter(Boolean).map(esc).join(' · ');
  const investors = (r.investors || []).length
    ? `<div class="meta">Backed by <b>${r.investors.map(esc).join(', ')}</b></div>` : '';
  // Four publishers is plenty to prove a round; the rest are on the control view.
  const all = (r.sources || []).filter(s => safeUrl(s.url));
  const shown = control ? all : all.slice(0, 4);
  const links = shown.map(s =>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.outlet || 'the article')}</a>`).join('')
    + (all.length > shown.length ? `<span class="more">+${all.length - shown.length} more</span>` : '');
  return `<article class="card">
    <div class="head">
      <span class="name">${name}</span>
      <span class="amount">${money(r)}</span>
      <span class="stage">${esc(r.stage || 'stage unstated')}</span>
      <span class="when">${esc(when(r.date))}</span>
    </div>
    ${about(r)}
    ${facts ? `<div class="meta">${facts}</div>` : ''}
    ${investors}
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    ${links ? `<div class="read"><span>Read it at</span> ${links}</div>` : ''}
    ${control && r.evidence ? `<blockquote>${esc(r.evidence)}</blockquote>` : ''}
  </article>`;
}

function render() {
  drawFacets(document.getElementById('regions'), DATA.meta.regions, 'regions', REGION_LABEL);
  drawFacets(document.getElementById('stages'), DATA.meta.stages, 'stages');
  const rows = ROUNDS.filter(r => matches(r)).sort((a, b) => state.sort === 'amount'
    ? (Number(b.amount_usd) || 0) - (Number(a.amount_usd) || 0)
    : String(b.date || '').localeCompare(String(a.date || '')));
  document.getElementById('list').innerHTML = rows.length
    ? rows.map(card).join('')
    : '<p class="empty">Nothing matches these filters.</p>';
  const pool = control ? ROUNDS.length : ROUNDS.filter(r => r.qualified).length;
  document.getElementById('count').textContent =
    rows.length === pool ? `${rows.length} rounds` : `${rows.length} of ${pool} rounds`;
}

function applyMode() {
  document.querySelectorAll('.ctrl').forEach(el => { el.hidden = !control; });
  document.getElementById('mode').textContent = control ? 'Hide working notes' : 'Working notes';
  const shown = control ? ROUNDS.length : ROUNDS.filter(r => r.qualified).length;
  document.getElementById('subtitle').textContent =
    `${shown} rounds raised in the last ${DATA.meta.window_days} days · updated ${when(DATA.meta.generated_at)}`;
  document.getElementById('footnote').textContent = control
    ? `${DATA.meta.total} rounds held, ${DATA.meta.qualified} in brief, ${DATA.meta.confirmed} confirmed, from ${DATA.meta.outlets} outlets. Amounts as reported; size filters use a rough USD equivalent.`
    : `Amounts are as reported by the outlet linked on each round.`;
  render();
}

document.getElementById('q').oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
document.getElementById('sort').onchange = e => { state.sort = e.target.value; render(); };
document.getElementById('minamt').onchange = e => { state.minAmount = Number(e.target.value); render(); };
document.getElementById('maxamt').onchange = e => { state.maxAmount = Number(e.target.value); render(); };
[['f-brief', 'brief'], ['f-confirmed', 'confirmed'], ['f-followed', 'followed'], ['f-ai', 'ai'], ['f-studio', 'hideStudios']].forEach(([id, key]) => {
  const b = document.getElementById(id);
  b.onclick = () => { state[key] = !state[key]; b.setAttribute('aria-pressed', String(state[key])); render(); };
});
document.getElementById('mode').onclick = () => {
  control = !control;
  try { localStorage.setItem('fr-control', control ? '1' : '0'); } catch (e) {}
  applyMode();
};
applyMode();
</script>
</body>
</html>
