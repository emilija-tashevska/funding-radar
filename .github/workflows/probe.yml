name: probe

# Checks that must run where the scan runs: are candidate sources reachable from
# GitHub's runner, what does discovery find, and which search API finds new
# in-brief UK rounds for the money. Reads the database; never writes it.
# The search probe spends real money (about six searches per provider with a key).
on:
  workflow_dispatch:
    inputs:
      search:
        description: "Run the paid search probe too"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/probe.yml"
      - "config/candidate_sources.yaml"
      - "scripts/verify_sources.py"
      - "scripts/search_probe.py"
      - "scripts/data_audit.py"
      - "src/funding_radar/describe.py"
      - "scripts/explore_site.py"
      - "src/funding_radar/sources/soapbox.py"
      - "scripts/soapbox_report.py"

permissions:
  contents: read

concurrency:
  group: funding-radar-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore the database (read only)
        run: |
          mkdir -p data
          git fetch --depth 1 origin data && git checkout FETCH_HEAD -- data/funding.db
          python -c "import sqlite3; c=sqlite3.connect('data/funding.db'); print(c.execute('select count(*) from rounds').fetchone()[0], 'rounds')"

      - name: Descriptions and direct links, on a copy of the database
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp data/funding.db data/described.db
          export DATABASE_PATH=data/described.db
          python -m src.funding_radar.cli recheck > /dev/null
          python scripts/data_audit.py | head -12
          python -m src.funding_radar.cli describe --limit 60
          python scripts/data_audit.py
          python -m src.funding_radar.cli site --out site-preview

      - name: Full scan twice on a copy of the live database (nothing saved)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-scan]')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_PATH: data/fullscan.db
        run: |
          cp data/funding.db data/fullscan.db
          for pass in 1 2; do
            echo "::group::scan pass $pass"
            start=$(date +%s)
            # Any crash fails the step, with its log; grep only chooses what to show.
            python -m src.funding_radar.cli run > run$pass.log 2>&1 || { tail -60 run$pass.log; exit 1; }
            grep -E "Soapbox|Discovery:|Extraction|Stored|stored|WARNING|ERROR" run$pass.log | tail -25 || true
            python -m src.funding_radar.cli recheck > /dev/null
            python -m src.funding_radar.cli dedupe > /dev/null
            python -m src.funding_radar.cli describe > describe$pass.log 2>&1 || { tail -40 describe$pass.log; exit 1; }
            tail -12 describe$pass.log
            python -m src.funding_radar.cli site --out site-preview > /dev/null
            echo "pass $pass took $(( $(date +%s) - start ))s"
            echo "::endgroup::"
          done
          python scripts/soapbox_report.py

      - name: Candidate sources, fetched from the runner
        run: python scripts/verify_sources.py

      - name: Discovery dry run (no model calls)
        run: python -m src.funding_radar.cli run --dry-run 2>&1 | tail -40

      - name: Search probe
        # Paid (about $0.40): only when asked for, never on a push.
        if: github.event_name == 'workflow_dispatch' && inputs.search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY is not visible to this job."; fi
          python scripts/search_probe.py --out probe_general.json
          python scripts/search_probe.py --set fund_queries --skip-composition --out probe_funds.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-reports
          path: |
            verify_report.json
            probe_general.json
            probe_funds.json
            site-preview/
